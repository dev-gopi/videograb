[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videograb"
version = "0.1.0"
description = "Local-first, extensible video link detector and download manager"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.111,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "typer>=0.12,<1",
  "beautifulsoup4>=4.12,<5", "pydantic>=2.7,<3", "yt-dlp>=2025.1.0",
]
[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "httpx>=0.27,<1"]

[project.scripts]
videograb = "videograb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
videograb = ["web/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
